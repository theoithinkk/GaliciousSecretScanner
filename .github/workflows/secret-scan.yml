name: secret scan

# Two jobs answering two different questions:
#   tests  - did we break the scanner
#   scan   - did the scanner find anything in this repo
#
# The scan job points the tool at its own checkout, which is a real target:
# tests/ and scripts/make_test_repo.py are full of deliberately fake keys, so
# a run should always produce findings. Zero findings would mean detection
# broke, not that the repo got cleaner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # The suite is stdlib unittest; there's no pytest to install.
      - run: python -m unittest discover -s tests -t . -v

  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write     # required to upload SARIF to Code Scanning
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for --history. The default checkout is shallow and the
          # history walk would see a single commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # --verify-live is deliberately absent. It would send every candidate
      # secret in the repo out to AWS/GitHub/Stripe/Slack from a CI runner,
      # which is not something a push should trigger on its own.
      #
      # --fail-on none because the upload has to run either way; findings land
      # as Code Scanning alerts instead of a red build. Once roadmap item 4
      # (baseline file) exists, this can become --fail-on high.
      - name: Scan for secrets
        run: python cli.py . --history --format sarif -o results.sarif --fail-on none

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: galicious-secret-scanner

      # Keeps the raw file around for when the upload itself is what needs
      # debugging. Safe to publish: ScoredFinding only carries redacted values.
      - name: Keep the SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-sarif
          path: results.sarif
